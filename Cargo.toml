[package]
name = "better-iptv"
version = "0.1.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "0.6"
ratatui = "0.29"
crossterm = "0.28"
nucleo = "0.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = "2"
quick-xml = "0.37"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "5"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
